name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  calidad:
    name: Lint y tipado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy pytest lxml-stubs

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: mypy
        run: mypy

  tests:
    name: Tests ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov freezegun respx

      - name: Tests
        run: pytest -m "not red and not certificado" --cov-report=xml

      - name: Subir cobertura
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml

  empaquetado:
    name: Empaquetado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Construir
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Verificar metadatos
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
