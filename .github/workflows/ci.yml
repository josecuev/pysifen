name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  POETRY_VERSION: "2.4.3"

jobs:
  calidad:
    name: Lint y tipado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: poetry

      - name: Verificar el manifiesto y el lock
        run: |
          poetry check --strict
          poetry check --lock

      - name: Instalar
        run: poetry install --with dev --no-interaction

      - name: El modulo generado esta al dia con el esquema
        run: poetry run python scripts/generar_modelos.py --check

      - name: Ruff (lint)
        run: poetry run ruff check --output-format=github .

      - name: Ruff (formato)
        run: poetry run ruff format --check .

      - name: mypy
        run: poetry run mypy

  tests:
    name: Tests ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: poetry

      - name: Instalar
        run: poetry install --with test --no-interaction

      - name: Tests
        run: poetry run pytest -m "not red and not certificado" --cov-report=xml

      - name: Subir cobertura
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobertura
          path: coverage.xml

  empaquetado:
    name: Empaquetado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: poetry

      - name: Construir
        run: poetry build

      - name: Verificar los metadatos
        run: |
          pipx install twine
          twine check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
