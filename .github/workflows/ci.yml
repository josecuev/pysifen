name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  POETRY_VERSION: "2.4.3"

jobs:
  calidad:
    name: Lint y tipado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: poetry

      - name: Verificar el manifiesto y el lock
        run: |
          poetry check --strict
          poetry check --lock

      - name: Instalar
        run: poetry install --with dev --all-extras --no-interaction

      - name: El modulo generado esta al dia con el esquema
        run: poetry run python scripts/generar_modelos.py --check

      - name: Ruff (lint)
        run: poetry run ruff check --output-format=github .

      - name: Ruff (formato)
        run: poetry run ruff format --check .

      - name: mypy
        run: poetry run mypy

  tests:
    name: Tests ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: poetry

      - name: Instalar
        # Con los extras: el servidor MCP es parte de lo que se prueba, y
        # sin ellos sus tests se saltean y la cobertura miente.
        run: poetry install --with test --all-extras --no-interaction

      - name: Tests
        run: poetry run pytest -m "not red and not certificado" --cov-report=xml

      - name: Subir cobertura
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura
          path: coverage.xml

  empaquetado:
    name: Empaquetado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: poetry

      - name: Construir
        run: poetry build

      - name: Verificar los metadatos
        run: |
          pipx install twine
          twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
