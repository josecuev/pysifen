name: Docker

# Construye la imagen, la escanea y —sólo en un tag de versión— la publica.
#
# El orden importa: **no se publica nada que no haya pasado el escaneo**. Una
# imagen es un binario que otros ejecutan; publicar una con una vulnerabilidad
# que ya tiene parche es trasladarle el problema a quien la usa.
#
# El escaneo también corre semanalmente sin que nadie toque el repositorio,
# porque una imagen publicada hace un mes se vuelve vulnerable sola: el CVE
# aparece después, en una dependencia del sistema base que nadie modificó.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  schedule:
    # Los lunes a las 06:30 en Asunción (UTC-3), después del resto de la
    # revisión de seguridad.
    - cron: "30 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGEN: josecuev/pysifen

jobs:
  construir-y-escanear:
    name: Construir y escanear
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Preparar buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Construir para escanear
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: ${{ env.IMAGEN }}:escaneo
          # --pull para que la base sea la última publicada y no una cacheada
          # con parches viejos.
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — todo lo que encuentre, al panel de seguridad
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ env.IMAGEN }}:escaneo
          format: sarif
          output: trivy.sarif
          scanners: vuln,secret,misconfig
        env:
          TRIVY_SKIP_DB_UPDATE: false

      - name: Publicar los resultados
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-imagen

      - name: Trivy — el que corta, sólo lo que tiene arreglo
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ env.IMAGEN }}:escaneo
          format: table
          severity: CRITICAL,HIGH
          # Sin arreglo publicado no hay nada que hacer salvo esperar al
          # proveedor. Cortar por eso convertiría la puerta en algo que todo el
          # mundo aprende a saltear, que es peor que no tenerla.
          ignore-unfixed: true
          exit-code: "1"

      - name: Inventario de componentes de la imagen
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGEN }}:escaneo
          format: cyclonedx-json
          artifact-name: sbom-imagen.cdx.json

  publicar:
    name: Publicar en Docker Hub
    needs: construir-y-escanear
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Preparar QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Preparar buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Entrar a Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calcular las etiquetas
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # latest sólo en una versión definitiva: un tag con guión es una
            # precandidata, y quien no fija versión no quiere una precandidata.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Construir y publicar
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # El SBOM y la procedencia viajan con la imagen: quien la baja puede
          # comprobar de qué commit salió y qué trae adentro sin confiar en la
          # palabra de nadie.
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      - name: Actualizar la descripción del repositorio
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGEN }}
          readme-filepath: ./docs/docker.md
