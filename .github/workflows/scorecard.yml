name: Scorecard

# Evaluación de la postura de seguridad del repositorio por la OpenSSF:
# ramas protegidas, dependencias fijadas, permisos de los tokens, análisis
# estático, firmas de release y demás. El resultado queda publicado en la
# pestaña de seguridad y sirve como evidencia auditable.

on:
  branch_protection_rule:
  push:
    branches: [master]
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analisis:
    name: Analizar
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ejecutar Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Publicar resultados
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard.sarif
          category: scorecard
