name: Vigilancia normativa

# El SIFEN se enmienda sin avisar a los integradores. Este workflow mira las
# fuentes oficiales una vez por semana y abre un issue si algo cambió.
#
# Ver docs/mantenimiento/vigilancia-normativa.md

on:
  schedule:
    # Lunes 07:00 en Asunción (UTC-3).
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  # Última nota técnica conocida. Subir este número al incorporar una nueva.
  ULTIMA_NOTA_TECNICA: "027"
  # Versión del Manual Técnico vigente.
  VERSION_MANUAL: "150"

jobs:
  revisar:
    name: Revisar las fuentes oficiales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ¿Salió una nota técnica nueva?
        id: notas
        run: |
          set -uo pipefail
          base="https://www.dnit.gov.py/documents/20123/420595"
          siguiente=$(printf "%03d" $((10#${ULTIMA_NOTA_TECNICA} + 1)))
          nuevas=""

          for _ in 1 2 3; do
            url="${base}/NT_E_KUATIA_${siguiente}_MT_V150.pdf"
            codigo=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 30 "$url" || echo "000")
            if [ "$codigo" = "200" ]; then
              echo "encontrada la NT-${siguiente}"
              nuevas="${nuevas} ${siguiente}"
              siguiente=$(printf "%03d" $((10#${siguiente} + 1)))
            else
              break
            fi
          done

          echo "nuevas=${nuevas# }" >> "$GITHUB_OUTPUT"

      - name: ¿Cambió la versión del Manual Técnico?
        id: manual
        run: |
          set -uo pipefail
          pagina="https://www.dnit.gov.py/web/e-kuatia/documentacion-tecnica"
          cuerpo=$(curl -sS -L --max-time 45 "$pagina" || echo "")
          otra=""
          for v in 160 170 151 152; do
            if printf '%s' "$cuerpo" | grep -qi "Versi.n[+ ]*${v}"; then
              otra="${otra} ${v}"
            fi
          done
          echo "otras=${otra# }" >> "$GITHUB_OUTPUT"

      - name: ¿Cambiaron los esquemas publicados?
        id: esquemas
        run: |
          set -uo pipefail
          pipx install poetry==2.4.3
          poetry install --only main --no-interaction
          if poetry run python scripts/verificar_esquemas.py; then
            echo "cambiaron=" >> "$GITHUB_OUTPUT"
          else
            echo "cambiaron=si" >> "$GITHUB_OUTPUT"
          fi

      - name: ¿Cambió la Lista de Confianza?
        id: confianza
        run: |
          set -uo pipefail
          if poetry run python scripts/verificar_lista_de_confianza.py; then
            echo "cambio=" >> "$GITHUB_OUTPUT"
          else
            echo "cambio=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir un issue si hay novedades
        if: >-
          steps.notas.outputs.nuevas != '' ||
          steps.manual.outputs.otras != '' ||
          steps.esquemas.outputs.cambiaron != '' ||
          steps.confianza.outputs.cambio != ''
        uses: actions/github-script@v9
        with:
          script: |
            const notas = '${{ steps.notas.outputs.nuevas }}';
            const manual = '${{ steps.manual.outputs.otras }}';
            const esquemas = '${{ steps.esquemas.outputs.cambiaron }}';
            const confianza = '${{ steps.confianza.outputs.cambio }}';
            const salto = String.fromCharCode(10, 10);
            let cuerpo = 'La vigilancia semanal encontró novedades en las fuentes oficiales.\n\n';
            if (notas) {
              cuerpo += `**Notas técnicas nuevas:** ${notas}\n\n`;
              cuerpo += 'Descargarlas, leer qué cambian y aplicarlas de forma acumulativa. ';
              cuerpo += 'Después subir `ULTIMA_NOTA_TECNICA` en este workflow.\n\n';
            }
            if (manual) {
              cuerpo += `**Posible versión nueva del Manual Técnico:** ${manual}\n\n`;
              cuerpo += 'Verificar en el portal. Un cambio de versión mayor obliga a revisar todo.\n\n';
            }
            if (esquemas) {
              cuerpo += '**Los esquemas XSD publicados cambiaron.**' + salto;
              cuerpo += 'Esto es lo mas importante que puede pasar: el XSD es contra lo que ';
              cuerpo += 'el SIFEN valida de verdad. Correr `python scripts/verificar_esquemas.py` ';
              cuerpo += 'para ver cuales, bajar las versiones nuevas, regenerar el manifiesto ';
              cuerpo += 'y revisar que cambio antes de publicar.' + salto;
            }
            if (confianza) {
              cuerpo += '**La Lista de Confianza cambio, o la copia incluida caduco.**' + salto;
              cuerpo += 'Es lo que decide que certificados son de un prestador cualificado ';
              cuerpo += 'habilitado. Si el MIC habilito a un prestador nuevo y la copia no lo ';
              cuerpo += 'trae, sus documentos se rechazan sin culpa; si le retiro la ';
              cuerpo += 'habilitacion a uno y la copia no se actualiza, se aceptan y es peor. ';
              cuerpo += 'Correr `python scripts/verificar_lista_de_confianza.py` para ver el ';
              cuerpo += 'detalle, bajar `tsl_Py.xml`, regenerar el manifiesto y revisar que ';
              cuerpo += 'prestadores cambiaron.' + salto;
            }
            cuerpo += 'Fuentes y procedimiento: `docs/mantenimiento/vigilancia-normativa.md`';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Novedades en la normativa del SIFEN',
              body: cuerpo,
              labels: ['normativa'],
            });

      - name: Sin novedades
        if: >-
          steps.notas.outputs.nuevas == '' &&
          steps.manual.outputs.otras == '' &&
          steps.esquemas.outputs.cambiaron == '' &&
          steps.confianza.outputs.cambio == ''
        run: |
          echo "Sin cambios: Manual Técnico v${VERSION_MANUAL}, NT-${ULTIMA_NOTA_TECNICA}, esquemas y Lista de Confianza intactos."
