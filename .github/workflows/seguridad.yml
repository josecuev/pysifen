name: Seguridad

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Los lunes a las 06:00 en Asunción (UTC-3). Una dependencia puede volverse
    # vulnerable sin que nadie toque el repositorio, así que el análisis corre
    # aunque no haya commits.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analizar
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}

  auditoria:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Exportar el árbol resuelto
        # pip-audit se ejecuta aislado, fuera del grafo del proyecto: su propio
        # árbol de dependencias tiene topes de versión que estrecharían el
        # rango de Python que soporta la librería.
        run: |
          pipx inject poetry poetry-plugin-export
          poetry export --without-hashes --with dev,test,docs -o requisitos.txt

      - name: pip-audit
        run: |
          pipx install pip-audit
          pip-audit --requirement requisitos.txt --strict --desc

  zizmor:
    name: Análisis de los workflows
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Analizar los workflows
        run: |
          pipx install zizmor
          zizmor --format sarif . > zizmor.sarif || true

      - name: Publicar resultados
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  sbom:
    name: Inventario de componentes (SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Exportar el arbol resuelto
        run: |
          pipx inject poetry poetry-plugin-export
          poetry export --without-hashes --with dev,test,docs --all-extras -o requisitos.txt

      - name: Generar el SBOM
        # CycloneDX es el formato que piden las auditorias de cadena de
        # suministro. Se genera desde el lock, no desde el entorno instalado,
        # para que el inventario sea reproducible.
        #
        # Via el archivo exportado y no con `cyclonedx-py poetry`: ese
        # subcomando todavia lee el nombre del proyecto de [tool.poetry], y
        # este manifiesto declara los metadatos en [project], como manda la
        # PEP 621.
        run: |
          pipx install cyclonedx-bom
          cyclonedx-py requirements requisitos.txt \
            --output-format json --output-file sbom.cdx.json

      - name: Publicar el SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
