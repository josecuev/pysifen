site_name: pysifen
site_description: >-
  Librería Python para el Sistema Integrado de Facturación Electrónica Nacional
  (SIFEN) de Paraguay
site_url: https://josecuev.github.io/pysifen/
repo_url: https://github.com/josecuev/pysifen
repo_name: josecuev/pysifen
edit_uri: edit/master/docs/
copyright: Distribuido bajo licencia MIT

theme:
  name: material
  language: es
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Seguir al sistema
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

plugins:
  - search:
      lang: es
  - gen-files:
      scripts:
        - docs/gen_referencia.py
  - literate-nav:
      nav_file: RESUMEN.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Inicio: index.md
  - Instalación: instalacion.md
  - Normativa vigente: normativa-vigente.md
  - Notas para agentes de IA: para-agentes.md
  - Servidor MCP: mcp.md
  - Hoja de ruta: hoja-de-ruta.md
  - Seguridad:
      - Custodia del certificado: seguridad/custodia.md
  - Mantenimiento:
      - Vigilancia normativa: mantenimiento/vigilancia-normativa.md
  - Decisiones:
      - Orden de los campos: decisiones/0001-orden-de-los-campos.md
      - Canonicalización: decisiones/0002-canonicalizacion.md
      - Esquemas oficiales: decisiones/0003-esquemas-oficiales.md
  - Referencia de la API: referencia/
